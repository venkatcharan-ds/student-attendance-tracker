spring.application.name=student-attendance

# Hosting platforms such as Render pass the port in $PORT; 8080 locally
server.port=${PORT:8080}

# Database connection is read from environment variables.
# If DATABASE_URL is not set, a local H2 file database (backend/data/attendancedb) is used,
# so students and attendance are saved permanently on disk.
# For PostgreSQL (e.g. Neon) set, for example:
#   DATABASE_URL=jdbc:postgresql://<host>/<database>?sslmode=require
#   DATABASE_USERNAME=<user>
#   DATABASE_PASSWORD=<password>
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/attendancedb;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# Small connection pool; recycle connections before serverless Postgres (Neon) drops idle ones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate: create or update the tables automatically (never drops data)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Allowed frontend origins for CORS (comma separated, "*" wildcards allowed,
# e.g. https://student-attendance-tracker*.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
